spring.datasource.url=${DB_LOCAL_URL:jdbc:sqlite:./policy-bff-local.db}
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.data-source-properties.date_class=TEXT
spring.datasource.hikari.data-source-properties.date_string_format=yyyy-MM-dd HH:mm:ss.SSS
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.type.preferred_date_jdbc_type=VARCHAR
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=INTEGER
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
springdoc.api-docs.enabled=true
