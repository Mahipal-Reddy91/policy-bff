spring.application.name=policy-bff
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=apac_policy_db;encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/openapi/policy-api.yaml
springdoc.swagger-ui.path=/swagger-ui.html
